name: Issue 29 pre-PR validation

on:
  push:
    branches: [validation/issue-29-skills-20260915]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export reviewed source snapshot
        run: git archive HEAD | gzip > "$RUNNER_TEMP/axyndra-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue29-source-${{ github.sha }}
          path: ${{ runner.temp }}/axyndra-source.tar.gz
          if-no-files-found: error
          retention-days: 1
