name: Nightly release gate

on:
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # The floating nightly is a compatibility canary, not reproducible
      # release evidence. The fixed release workflow owns that proof.
      AXYNDRA_CI_COMPATIBILITY_CANARY: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true
      - name: Install native compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-15 ripgrep unzip
          sudo ln -sfnT /usr/lib/llvm-15 /usr/lib/llvm15
      - name: Resolve latest Cangjie nightly
        id: cangjie-nightly
        run: |
          version=$(python3 scripts/latest_cangjie_nightly.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: nightly
          version: ${{ steps.cangjie-nightly.outputs.version }}
          archive-path: ${{ runner.temp }}/cangjie-nightly.tar.gz
      - name: Setup matching nightly stdx
        run: |
          stdx_root=$(bash scripts/setup_ci_stdx.sh \
            "${{ steps.cangjie-nightly.outputs.version }}" "$RUNNER_TEMP")
          echo "CANGJIE_STDX_PATH=$stdx_root" >> "$GITHUB_ENV"
      - name: Configure pinned SDK
        run: |
          sdk_root=$(dirname "$(dirname "$(command -v cjc)")")
          cjpm_output=$(cjpm --version 2>&1)
          expected_cjpm_version=${cjpm_output##* }
          echo "AXYNDRA_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "AXYNDRA_CI_EXPECTED_CJC_VERSION=${{ steps.cangjie-nightly.outputs.version }}" >> "$GITHUB_ENV"
          echo "AXYNDRA_CI_EXPECTED_CJPM_VERSION=$expected_cjpm_version" >> "$GITHUB_ENV"
          AXYNDRA_CI_EXPECTED_CJC_VERSION="${{ steps.cangjie-nightly.outputs.version }}" \
            AXYNDRA_CI_EXPECTED_CJPM_VERSION="$expected_cjpm_version" \
            AXYNDRA_SDK_ROOT="$sdk_root" scripts/check_sdk.sh
      - name: Full local release gate (compatibility canary)
        env:
          AXYNDRA_GATE_KIND: implementation
          AXYNDRA_EVIDENCE_DIR: ${{ runner.temp }}/axyndra-evidence
        run: bash scripts/release_gate.sh
      - name: Write CI evidence
        if: always()
        run: |
          python3 scripts/ci_evidence.py \
            --gate nightly-compatibility-canary \
            --status "${{ job.status }}" \
            --output-dir "$RUNNER_TEMP/axyndra-evidence" \
            --artifact-path target/release/bin/agent_app
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axyndra-nightly-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/axyndra-evidence
          if-no-files-found: error
          retention-days: 30
