name: Protected release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AXYNDRA_CI_EXPECTED_CJPM_VERSION: 1.3.0-alpha.02
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Install native compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-15 ripgrep
          sudo ln -sfnT /usr/lib/llvm-15 /usr/lib/llvm15
      - name: Resolve latest Cangjie nightly
        id: cangjie-nightly
        run: |
          version=$(python3 scripts/latest_cangjie_nightly.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@647b8de21a4c9f95e4d4f5565ca75110fa9d17e4
        with:
          channel: nightly
          version: ${{ steps.cangjie-nightly.outputs.version }}
          components: stdx
      - name: Configure pinned SDK
        run: |
          sdk_root=$(dirname "$(dirname "$(command -v cjc)")")
          echo "AXYNDRA_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          AXYNDRA_CI_EXPECTED_CJC_VERSION="${{ steps.cangjie-nightly.outputs.version }}" \
            AXYNDRA_SDK_ROOT="$sdk_root" scripts/check_sdk.sh
      - name: Release gate with real provider smoke
        env:
          AXYNDRA_GATE_KIND: release
          AXYNDRA_REAL_SMOKE: "1"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bash scripts/release_gate.sh
