name: Protected release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AXYNDRA_NATIVE_CC: /usr/bin/clang-15
      AXYNDRA_NATIVE_AR: /usr/bin/llvm-ar-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
      - name: Install native compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-15 ripgrep unzip python3-yaml bubblewrap
          # The workspace sandbox executes every tool through bubblewrap;
          # ubuntu-24.04 images restrict unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Load pinned Cangjie toolchain
        id: cangjie-toolchain
        run: |
          source scripts/ci_toolchain.env
          cat scripts/ci_toolchain.env >> "$GITHUB_ENV"
          echo "version=$AXYNDRA_CI_CANGJIE_VERSION" >> "$GITHUB_OUTPUT"
          echo "stdx_sha256=$AXYNDRA_CI_STDX_SHA256" >> "$GITHUB_OUTPUT"
      - name: Setup verified pinned Cangjie
        run: |
          bash scripts/setup_ci_sdk.sh "$AXYNDRA_CI_CANGJIE_VERSION" "$RUNNER_TEMP" "$AXYNDRA_CI_SDK_SHA256"
      - name: Setup matching stdx
        run: |
          stdx_root=$(bash scripts/setup_ci_stdx.sh \
            "${{ steps.cangjie-toolchain.outputs.version }}" "$RUNNER_TEMP" \
            "${{ steps.cangjie-toolchain.outputs.stdx_sha256 }}")
          echo "CANGJIE_STDX_PATH=$stdx_root" >> "$GITHUB_ENV"
      - name: Configure pinned SDK
        run: |
          sdk_root=$(dirname "$(dirname "$(command -v cjc)")")
          echo "AXYNDRA_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "AXYNDRA_CI_EXPECTED_CJC_VERSION=${{ steps.cangjie-toolchain.outputs.version }}" >> "$GITHUB_ENV"
          AXYNDRA_CI_EXPECTED_CJC_VERSION="${{ steps.cangjie-toolchain.outputs.version }}" \
            AXYNDRA_SDK_ROOT="$sdk_root" scripts/check_sdk.sh
      - name: Release gate with real provider smoke
        env:
          AXYNDRA_GATE_KIND: release
          AXYNDRA_REAL_SMOKE: "1"
          AXYNDRA_EVIDENCE_DIR: ${{ runner.temp }}/axyndra-evidence
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bash scripts/release_gate.sh
      - name: Write CI evidence
        if: always()
        run: |
          python3 scripts/ci_evidence.py \
            --gate protected-release \
            --status "${{ job.status }}" \
            --output-dir "$RUNNER_TEMP/axyndra-evidence" \
            --artifact-path target/release/bin/agent_app
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axyndra-release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/axyndra-evidence
          if-no-files-found: error
          retention-days: 90
