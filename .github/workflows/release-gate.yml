name: Protected release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AXYNDRA_CI_EXPECTED_CJC_VERSION: 1.1.3
      AXYNDRA_CI_EXPECTED_CJPM_VERSION: 1.1.3
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Install native compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-15 ripgrep
          sudo ln -sfnT /usr/lib/llvm-15 /usr/lib/llvm15
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: sts
          version: 1.1.3
          archive-path: ${{ runner.temp }}/cangjie-sts.tar.gz
      - name: Configure pinned SDK
        run: |
          sdk_root=$(dirname "$(dirname "$(command -v cjc)")")
          echo "AXYNDRA_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          AXYNDRA_SDK_ROOT="$sdk_root" scripts/check_sdk.sh
      - name: Release gate with real provider smoke
        env:
          AXYNDRA_GATE_KIND: release
          AXYNDRA_REAL_SMOKE: "1"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bash scripts/release_gate.sh
