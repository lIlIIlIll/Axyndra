name: PR gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AXYNDRA_CI_EXPECTED_CJPM_VERSION: 1.3.0-alpha.03
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Install native compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-15 ripgrep unzip
          sudo ln -sfnT /usr/lib/llvm-15 /usr/lib/llvm15
      - name: Load pinned Cangjie toolchain
        id: cangjie-toolchain
        run: |
          source scripts/ci_toolchain.env
          echo "version=$AXYNDRA_CI_CANGJIE_VERSION" >> "$GITHUB_OUTPUT"
          echo "stdx_sha256=$AXYNDRA_CI_STDX_SHA256" >> "$GITHUB_OUTPUT"
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: nightly
          version: ${{ steps.cangjie-toolchain.outputs.version }}
          archive-path: ${{ runner.temp }}/cangjie-nightly.tar.gz
      - name: Setup matching nightly stdx
        run: |
          stdx_root=$(bash scripts/setup_ci_nightly_stdx.sh \
            "${{ steps.cangjie-toolchain.outputs.version }}" "$RUNNER_TEMP" \
            "${{ steps.cangjie-toolchain.outputs.stdx_sha256 }}")
          echo "CANGJIE_STDX_PATH=$stdx_root" >> "$GITHUB_ENV"
      - name: Configure pinned SDK
        run: |
          sdk_root=$(dirname "$(dirname "$(command -v cjc)")")
          echo "AXYNDRA_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "AXYNDRA_CI_EXPECTED_CJC_VERSION=${{ steps.cangjie-toolchain.outputs.version }}" >> "$GITHUB_ENV"
          AXYNDRA_CI_EXPECTED_CJC_VERSION="${{ steps.cangjie-toolchain.outputs.version }}" \
            AXYNDRA_SDK_ROOT="$sdk_root" scripts/check_sdk.sh
      - name: Repository policy gates
        run: |
          python3 scripts/tracked_artifact_gate.py
          python3 scripts/docs_gate.py
          scripts/architecture_gate_lib_test.sh
          python3 scripts/tracked_artifact_gate_test.py
          python3 scripts/docs_gate_test.py
          scripts/architecture_gate.sh
      - name: Clean Cangjie check
        run: |
          scripts/pinned_cangjie cjpm clean
          scripts/pinned_cangjie cjpm check
      - name: Isolated package and consumer tests
        run: |
          AXYNDRA_PACKAGE_TECHNICAL_ONLY=1 \
            bash scripts/package_readiness_gate.sh
      - name: Build product executable
        run: |
          scripts/pinned_cangjie cjpm build -m agent_app -o agent_app
      - name: vNext focused contracts
        run: |
          python3 scripts/vnext_contract_gate.py \
            --sdk-root "$AXYNDRA_SDK_ROOT"
