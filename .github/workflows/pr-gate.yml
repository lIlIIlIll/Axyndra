name: PR gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AXYNDRA_CI_EXPECTED_CJPM_VERSION: 1.1.3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true
      - name: Install native compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-15 ripgrep unzip python3-yaml bubblewrap
          sudo ln -sfnT /usr/lib/llvm-15 /usr/lib/llvm15
          # The workspace sandbox executes every tool through bubblewrap;
          # ubuntu-24.04 images restrict unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Load pinned Cangjie toolchain
        id: cangjie-toolchain
        run: |
          source scripts/ci_toolchain.env
          cat scripts/ci_toolchain.env >> "$GITHUB_ENV"
          echo "version=$AXYNDRA_CI_CANGJIE_VERSION" >> "$GITHUB_OUTPUT"
          echo "stdx_sha256=$AXYNDRA_CI_STDX_SHA256" >> "$GITHUB_OUTPUT"
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: sts
          version: ${{ steps.cangjie-toolchain.outputs.version }}
          archive-path: ${{ runner.temp }}/cangjie-sts.tar.gz
      - name: Setup matching stdx
        run: |
          stdx_root=$(bash scripts/setup_ci_stdx.sh \
            "${{ steps.cangjie-toolchain.outputs.version }}" "$RUNNER_TEMP" \
            "${{ steps.cangjie-toolchain.outputs.stdx_sha256 }}")
          echo "CANGJIE_STDX_PATH=$stdx_root" >> "$GITHUB_ENV"
      - name: Configure pinned SDK
        run: |
          sdk_root=$(dirname "$(dirname "$(command -v cjc)")")
          echo "AXYNDRA_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "AXYNDRA_CI_EXPECTED_CJC_VERSION=${{ steps.cangjie-toolchain.outputs.version }}" >> "$GITHUB_ENV"
          AXYNDRA_CI_EXPECTED_CJC_VERSION="${{ steps.cangjie-toolchain.outputs.version }}" \
            AXYNDRA_SDK_ROOT="$sdk_root" scripts/check_sdk.sh
      - name: Repository policy gates
        run: |
          python3 scripts/tracked_artifact_gate.py
          python3 scripts/docs_gate.py
          scripts/architecture_gate_lib_test.sh
          python3 scripts/tracked_artifact_gate_test.py
          python3 scripts/docs_gate_test.py
          scripts/architecture_gate.sh
      - name: Clean Cangjie check
        run: |
          scripts/pinned_cangjie cjpm clean
          scripts/pinned_cangjie cjpm check
      - name: Workspace unit tests
        env:
          AXYNDRA_EVIDENCE_DIR: ${{ runner.temp }}/axyndra-evidence
        run: python3 scripts/product_unit_gate.py
      - name: Build product executable
        run: |
          scripts/pinned_cangjie cjpm build -m agent_app -o agent_app
      - name: vNext focused contracts
        env:
          AXYNDRA_EVIDENCE_DIR: ${{ runner.temp }}/axyndra-evidence
        run: |
          python3 scripts/vnext_contract_gate.py \
            --sdk-root "$AXYNDRA_SDK_ROOT"
      - name: Product regression fixtures
        run: scripts/pinned_cangjie bash scripts/product_regression_gate.sh
      - name: Write CI evidence
        if: always()
        run: |
          python3 scripts/ci_evidence.py \
            --gate pr-gate \
            --status "${{ job.status }}" \
            --output-dir "$RUNNER_TEMP/axyndra-evidence" \
            --artifact-path target/release/bin/agent_app
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axyndra-pr-gate-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/axyndra-evidence
          if-no-files-found: error
          retention-days: 14
