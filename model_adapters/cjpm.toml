[package]
  cjc-version = "1.1.0"
  name = "model_adapters"
  organization = ""
  description = "Native provider protocol and transport adapters for Agent ModelPort"
  version = "1.0.0"
  output-type = "static"

[dependencies]
  "agent_domain" = { path = "../agent_domain", output-type = "static" }
  "agent_ports" = { path = "../agent_ports", output-type = "static" }
  "yjson" = { git = "https://github.com/lIlIIlIll/yjson.git", commitId = "92858f75aedc3dd6f7322789117854514549e62c", branch = "main", output-type = "static" }
  "yjson_support" = { path = "../libs/yjson_support", output-type = "static" }
  "llm4cj" = { git = "https://github.com/lIlIIlIll/llm4cj.git", commitId = "4cb831950c6e82977179c3bbf8c8a20afd787238", branch = "main", output-type = "static" }
  "process4cj" = { path = "../libs/process4cj", output-type = "static" }

[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}"]
