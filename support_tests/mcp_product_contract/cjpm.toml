[package]
  cjc-version = "1.1.0"
  name = "mcp_product_contract"
  organization = ""
  description = "Executable MCP product-composition contract"
  version = "1.0.0"
  output-type = "executable"
  link-option = "--whole-archive /usr/lib/llvm15/lib/clang/15.0.7/lib/linux/libclang_rt.profile-x86_64.a --no-whole-archive -lsqlite3"

[dependencies]
  "yjson_support" = { path = "../../libs/yjson_support", output-type = "static" }
  "yjson" = { git = "https://github.com/lIlIIlIll/yjson.git", commitId = "92858f75aedc3dd6f7322789117854514549e62c", branch = "main", output-type = "static" }
  "agent_domain" = { path = "../../agent_domain", output-type = "static" }
  "agent_mcp" = { path = "../../agent_mcp", output-type = "static" }
  "agent_product" = { path = "../../agent_product", output-type = "static" }
  "tool_runtime" = { path = "../../tool_runtime", output-type = "static" }
