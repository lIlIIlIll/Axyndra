[package]
  cjc-version = "1.1.0"
  name = "mcp_product_contract"
  organization = ""
  description = "Executable MCP product-composition contract"
  version = "1.0.0"
  output-type = "executable"
  link-option = "--whole-archive -L${AXYNDRA_CLANG_RUNTIME_PATH} -lclang_rt.profile-x86_64 --no-whole-archive -lsqlite3"

[dependencies]
  "yjson_support" = { path = "../../libs/yjson_support", output-type = "static" }
  "yjson" = { git = "https://github.com/lIlIIlIll/yjson.git", tag = "0.1.0", output-type = "static" }
  "agent_domain" = { path = "../../agent_domain", output-type = "static" }
  "agent_mcp" = { path = "../../agent_mcp", output-type = "static" }
  "agent_product" = { path = "../../agent_product", output-type = "static" }
  "tool_runtime" = { path = "../../tool_runtime", output-type = "static" }
