[package]
  cjc-version = "1.1.0"
  name = "thread_scale_vnext_contract"
  organization = ""
description = "100k Item and multi-Lane persistence/fairness scaling contract"
  version = "1.0.0"
  output-type = "executable"
  link-option = "-lsqlite3"

[dependencies]
  "yjson_support" = { path = "../../libs/yjson_support", output-type = "static" }
  "yjson" = { git = "https://github.com/lIlIIlIll/yjson.git", branch = "main", output-type = "static" }
  "agent_domain" = { path = "../../agent_domain", output-type = "static" }
  "agent_runtime" = { path = "../../agent_runtime", output-type = "static" }
  "agent_store" = { path = "../../agent_store", output-type = "static" }
