[package]
  cjc-version = "1.1.0"
  name = "extensions_contract"
  organization = ""
  description = "Executable typed extension contract"
  version = "1.0.0"
  output-type = "executable"
  src-dir = "src"
  target-dir = "target"

[dependencies]
  "legacy_extension_sdk" = { path = "../legacy_extension_sdk", output-type = "static" }
  "agent_domain" = { path = "../../agent_domain", output-type = "static" }
  "legacy_extension_host" = { path = "../legacy_extension_host", output-type = "static" }
  "agent_ports" = { path = "../../agent_ports", output-type = "static" }
  "agent_sdk" = { path = "../../agent_sdk", output-type = "static" }
  "agent_testkit" = { path = "../../agent_testkit", output-type = "static" }
  "agent_runtime" = { path = "../../agent_runtime", output-type = "static" }
  "yjson" = { git = "https://github.com/lIlIIlIll/yjson.git", tag = "0.1.0", output-type = "static" }
  "yjson_support" = { path = "../../libs/yjson_support", output-type = "static" }
  "tool_runtime" = { path = "../../tool_runtime", output-type = "static" }
  "workspace_search_extension" = { path = "../workspace_search_legacy_oracle", output-type = "static" }
  "workspace_write_extension" = { path = "../workspace_write_legacy_oracle", output-type = "static" }
