[package]
  cjc-version = "1.1.0"
  name = "memory_contract"
  organization = ""
  description = "Executable durable memory and managed-skill contract"
  version = "1.0.0"
  output-type = "executable"
  link-option = "-lsqlite3"

[dependencies]
  "yjson_support" = { path = "../../libs/yjson_support", output-type = "static" }
  "yjson" = { git = "https://github.com/lIlIIlIll/yjson.git", branch = "main", output-type = "static" }
  "agent_domain" = { path = "../../agent_domain", output-type = "static" }
  "agent_product" = { path = "../../agent_product", output-type = "static" }
  "persistence_runtime" = { path = "../../persistence_runtime", output-type = "static" }
  "tool_runtime" = { path = "../../tool_runtime", output-type = "static" }
