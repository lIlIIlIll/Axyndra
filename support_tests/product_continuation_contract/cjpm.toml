  "agent_core" = { path = "../../agent_core", output-type = "static" }
  "agent_domain" = { path = "../../agent_domain", output-type = "static" }
  "agent_product" = { path = "../../agent_product", output-type = "static" }
  "agent_store" = { path = "../../agent_store", output-type = "static" }
  "model_adapters" = { path = "../../model_adapters", output-type = "static" }
  "persistence_runtime" = { path = "../../persistence_runtime", output-type = "static" }
  "tool_runtime" = { path = "../../tool_runtime", output-type = "static" }
