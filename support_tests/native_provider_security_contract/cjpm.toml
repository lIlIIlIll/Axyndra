[package]
  cjc-version = "1.1.0"
  name = "native_provider_security_contract"
  organization = ""
  description = "Public contract for native provider URL and credential safety"
  version = "1.0.0"
  output-type = "executable"
  link-option = "-lsqlite3"

[dependencies]
  "agent_domain" = { path = "../../agent_domain", output-type = "static" }
  "agent_product" = { path = "../../agent_product", output-type = "static" }
  "model_adapters" = { path = "../../model_adapters", output-type = "static" }

[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}"]
