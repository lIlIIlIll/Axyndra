[package]
  cjc-version = "1.1.0"
  name = "prompt_memory_v3_contract"
  organization = ""
  description = "Executable PromptBuilder, ProjectContext, and Memory v3 contract"
  version = "1.0.0"
  output-type = "executable"
  link-option = "-lsqlite3"
  src-dir = "src"
  target-dir = "target"

[dependencies]
  "memory_legacy_oracle" = { path = "../memory_legacy_oracle", output-type = "static" }
  "agent_product" = { path = "../../agent_product", output-type = "static" }
  "yjson" = { git = "https://github.com/lIlIIlIll/yjson.git", tag = "0.1.0", output-type = "static" }
  "yjson_support" = { path = "../../libs/yjson_support", output-type = "static" }
  "agent_core" = { path = "../../agent_core", output-type = "static" }
  "agent_domain" = { path = "../../agent_domain", output-type = "static" }
  "persistence_runtime" = { path = "../../persistence_runtime", output-type = "static" }

[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}"]
