[package]
  cjc-version = "1.1.0"
  name = "agent_store"
  organization = ""
  description = "SQLite WAL durable metadata store for vNext"
  version = "1.0.0"
  output-type = "static"
  link-option = "-lsqlite3"

[dependencies]
  "yjson_support" = { path = "../libs/yjson_support", output-type = "static" }
  "yjson" = { git = "https://github.com/lIlIIlIll/yjson.git", commitId = "92858f75aedc3dd6f7322789117854514549e62c", branch = "main", output-type = "static" }
  "agent_domain" = { path = "../agent_domain", output-type = "static" }
  "agent_ports" = { path = "../agent_ports", output-type = "static" }
  "agent_runtime" = { path = "../agent_runtime", output-type = "static" }
  "agent_skills" = { path = "../agent_skills", output-type = "static" }
