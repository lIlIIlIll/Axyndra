[package]
  cjc-version = "1.1.0"
  name = "mcp4cj"
  organization = ""
  description = "Agent-independent Model Context Protocol types and primitives"
  version = "0.1.0"
  output-type = "static"

[dependencies]
  "yjson" = { git = "https://github.com/lIlIIlIll/yjson.git", commitId = "92858f75aedc3dd6f7322789117854514549e62c", output-type = "static" }
  "yjson_support" = { path = "../yjson_support", output-type = "static" }
  "jsonrpc4cj" = { path = "../jsonrpc4cj", output-type = "static" }
  "process4cj" = { path = "../process4cj", output-type = "static" }

[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}"]
