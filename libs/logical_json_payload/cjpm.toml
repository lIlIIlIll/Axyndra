[package]
cjc-version = "1.1.0"
name = "logical_json_payload"
version = "1.0.0"
description = "Shared neutral JSON framing and original logical allocation custody"
output-type = "static"

[dependencies]
"yjson" = { git = "https://github.com/lIlIIlIll/yjson.git", tag = "0.1.0", output-type = "static" }
"yjson_support" = { path = "../yjson_support", output-type = "static" }

[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}"]
