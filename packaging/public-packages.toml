[public]
generic = [
  "libs/yjson_support",
  "libs/jsonrpc4cj",
  "libs/process4cj",
  "libs/mcp4cj",
  "libs/sandbox4cj",
  "libs/lsp4cj",
  "libs/dap4cj",
]
ecosystem = [
  "agent_sdk",
  "axyndra_agent_testkit",
]

[hold]
experimental = [
  "libs/skill_runtime",
]

[internal]
packages = [
  "libs/logical_json_payload",
  "agent_history",
  "agent_minimal",
  "agent_plugin_registry",
  "agent_domain",
  "agent_app_protocol",
  "agent_skills",
  "agent_runtime",
  "agent_store",
  "agent_protocol",
  "agent_ports",
  "agent_core",
  "tool_runtime",
  "persistence_runtime",
  "run_control",
  "task_runtime",
  "agent_client",
  "agent_cli",
  "model_adapters",
  "model_provider_runtime",
  "model_fixture_runtime",
  "agent_embed",
  "agent_extension_runtime",
  "agent_testkit",
  "agent_product",
  "agent_host_runtime",
  "agent_rpc",
  "agent_tui",
  "agent_app",
]

[runtime_requirements]
yjson_support = ["yjson tag 0.1.0"]
jsonrpc4cj = []
process4cj = ["linux-x86_64", "glibc"]
mcp4cj = ["Cangjie stdx", "process executable for stdio transport"]
sandbox4cj = ["Linux", "bubblewrap for enforcement", "timeout/prlimit when configured"]
lsp4cj = ["language server executable supplied by host"]
dap4cj = ["debug adapter executable supplied by host"]
agent_sdk = []
axyndra_agent_testkit = []

[stability]
yjson_support = "pre-1.0 Axyndra JSON integration helpers"
jsonrpc4cj = "pre-1.0 public generic"
process4cj = "pre-1.0 public generic; Linux x86_64 implementation"
mcp4cj = "pre-1.0 public generic"
sandbox4cj = "stable public generic; Linux implementation"
lsp4cj = "stable public generic"
dap4cj = "stable public generic"
agent_sdk = "Native source-authoring API 3; existing Native wire SDK 2.1"
axyndra_agent_testkit = "stable public test seams with documented experimental helpers"
