[package]
  cjc-version = "1.1.0"
  name = "workspace_plugin"
  organization = ""
  description = "Independent native workspace reads, search and hashline file plans"
  version = "1.0.0"
  output-type = "executable"

[dependencies]
  "agent_domain" = { path = "../../agent_domain", output-type = "static" }
