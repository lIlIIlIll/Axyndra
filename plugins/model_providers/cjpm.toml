[package]
  cjc-version = "1.1.0"
  name = "native_model_providers"
  organization = ""
  description = "Isolated ModelProvider contributions using the existing typed provider wire adapters"
  version = "1.2.0"
  output-type = "executable"

[dependencies]
  "agent_domain" = { path = "../../agent_domain", output-type = "static" }
  "model_provider_runtime" = { path = "../../model_provider_runtime", output-type = "static" }
  "model_adapters" = { path = "../../model_adapters", output-type = "static" }
  "process4cj" = { path = "../../libs/process4cj", output-type = "static" }
  "yjson" = { git = "https://github.com/lIlIIlIll/yjson.git", tag = "0.1.0", output-type = "static" }
  "yjson_support" = { path = "../../libs/yjson_support", output-type = "static" }

[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}"]
